# v3.1.0 Phase 2 Session 5 — stack de test E2E pour le backup cloud.
#
# Lance MinIO (S3-compat local) + Postgres test isolé.
#
# Usage :
#   docker compose -f docker-compose.test.yml up -d
#   TEST_E2E=1 npx tsx tests/v3-backup-e2e.test.mts
#   docker compose -f docker-compose.test.yml down -v
#
# Volumes éphémères — supprimés au down. La DB de test est seedée à la
# volée par le test (pas de fixture persistante).

version: '3.8'

services:
  test-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: openquittance-test-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: testuser
      MINIO_ROOT_PASSWORD: testpassword123
    ports:
      - "9100:9000"   # API S3
      - "9101:9001"   # console web
    volumes:
      - test-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  test-db:
    image: postgres:16-alpine
    container_name: openquittance-test-db
    environment:
      POSTGRES_DB: openquittance_test
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
    ports:
      - "55432:5432"
    volumes:
      - test-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d openquittance_test"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  test-minio-data:
  test-db-data:
