version: '3.8'

# Pour le dev local: lance uniquement Postgres, l'app tourne en `npm run dev` sur le host.
services:
  db:
    image: postgres:16-alpine
    container_name: quittances-db-dev
    environment:
      POSTGRES_DB: quittances
      POSTGRES_USER: quittances
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quittances"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata-dev:
